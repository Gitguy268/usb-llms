name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: Real engine and model
        shell: bash
        run: |
          go build -o drive/bin/usb-llms .
          drive/bin/usb-llms setup --lean --model smollm2-135m
          drive/bin/usb-llms mode offline
          drive/bin/usb-llms run hf.co/bartowski/SmolLM2-135M-Instruct-GGUF:Q4_K_M "Say hi." </dev/null
          drive/bin/usb-llms stop
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - name: Launchers parse
        run: |
          sh -n start.sh
          bash -n start.command
